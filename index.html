<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쉼표 연차 관리</title>
<meta name="description" content="연차 발생, 신청, 승인, 집계를 한곳에서 관리합니다.">
<meta name="theme-color" content="#0f3d33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f3d33'/%3E%3Cpath fill='%23ffc93c' d='M16 7a6 6 0 0 1 6 6c0 6-4 10-9 12l-1-2c2-1 4-3 5-5a6 6 0 0 1-1-11z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme:light;
  --bg:#eef2ee;--surface:#fff;--surface-2:#f4f7f4;--line:#dfe6e0;
  --ink:#12211c;--ink-2:#46564f;--ink-3:#5f6f68;
  --pine:#0f3d33;--pine-2:#17574a;--sun:#ffc93c;--sun-ink:#2b2000;
  --primary:#0f3d33;--primary-ink:#fff;
  --tile-off:rgba(255,255,255,.1);--tile-hold:rgba(255,201,60,.38);
  --good:#d9f2e3;--good-ink:#0d5233;--wait:#fff0c2;--wait-ink:#6a4b00;--bad:#fde3e1;--bad-ink:#9b211b;
  --chip-full:#0f3d33;--chip-full-ink:#fff;--chip-half:#cfe6dc;--chip-half-ink:#0f3d33;
  --bar:#17574a;
  --shadow:0 18px 50px rgba(15,61,51,.16);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#0a1512;--surface:#13211d;--surface-2:#1a2b26;--line:#263a33;
    --ink:#ecf3ef;--ink-2:#bccac3;--ink-3:#9fb0a8;
    --primary:#ffc93c;--primary-ink:#2b2000;
    --good:#123d2a;--good-ink:#9fe6c0;--wait:#43350c;--wait-ink:#ffdf85;--bad:#4a1b18;--bad-ink:#ffb4ae;
    --chip-full:#ffc93c;--chip-full-ink:#2b2000;--chip-half:#2c4a40;--chip-half-ink:#e3f2ea;
    --bar:#ffc93c;
    --shadow:0 18px 50px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid #2f8f75;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 상단 */
.testbar{background:var(--pine);color:#dfeee7;font-size:13px;padding:7px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.testbar b{color:var(--sun);font-weight:700}
.testbar label{display:flex;align-items:center;gap:6px}
.testbar select,.testbar input{background:rgba(255,255,255,.12);border:0;border-radius:8px;padding:4px 8px;color:#fff;min-height:30px;color-scheme:dark}
.testbar select option{color:#12211c;background:#fff}
.testbar button{color:#fff;text-decoration:underline;text-underline-offset:3px;min-height:30px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand svg{width:32px;height:32px;flex:none}
.tabs{display:flex;gap:4px}
.tab{position:relative;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--ink-2);min-height:44px}
.tab:hover{background:var(--surface-2)}
.tab[aria-current=page]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad-ink);color:#fff;font-size:12px;font-weight:700;margin-left:5px}
@media (prefers-color-scheme:dark){.badge{color:#2a0a08}}
.top-end{margin-left:auto;display:flex;align-items:center;gap:6px}
.link{padding:8px 10px;border-radius:10px;color:var(--ink-2);font-weight:500;min-height:44px}
.link:hover{background:var(--surface-2)}
.wrap{max-width:1180px;margin:auto;padding:26px 20px 90px}
.narrow{max-width:760px;margin:auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.head h1{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.25}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:13px;font-weight:700;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad);color:var(--bad-ink)}
.btn[disabled]{opacity:.55;cursor:default}
.tabbar{display:none}

/* 25칸 */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap,8px)}
.t{aspect-ratio:1;border-radius:24%;background:linear-gradient(90deg,var(--sun) var(--a,0%),var(--tile-hold) var(--a,0%),var(--tile-hold) var(--b,0%),var(--tile-off) var(--b,0%))}
.tiles.lit .t{animation:lit .4s both;animation-delay:calc(var(--i)*16ms)}
@keyframes lit{from{opacity:.15;transform:scale(.82)}to{opacity:1;transform:none}}
.icon-grid{--gap:2px;width:46px;height:46px;flex:none;padding:6px;border-radius:13px;background:var(--pine)}

/* 히어로 */
.hero{background:var(--pine);color:#fff;border-radius:28px;padding:30px;display:grid;grid-template-columns:1fr minmax(190px,270px);gap:30px;align-items:center}
.hero .who{font-size:15px;color:#c7ddd3}
.hero .who b{color:#fff;font-size:19px;font-weight:700;display:block;letter-spacing:-.01em}
.hero .big{display:flex;align-items:baseline;gap:6px;margin:20px 0 2px;font-weight:800;letter-spacing:-.045em;line-height:1}
.hero .big span:first-child{font-size:clamp(68px,10vw,104px)}
.hero .big span:last-child{font-size:26px;letter-spacing:-.01em}
.hero .sub{color:#d6e6df;min-height:24px}
.hero .btn{margin-top:20px}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.hero .btn.quiet{background:rgba(255,255,255,.12);color:#fff}

.panel{background:var(--surface);border-radius:20px;padding:20px 22px;margin-top:14px}
.panel h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px;background:var(--surface);border-radius:20px;padding:18px 22px}
.facts div b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.alert{margin-top:14px;padding:14px 18px;border-radius:16px;background:var(--wait);color:var(--wait-ink);font-weight:500}
.next{display:flex;justify-content:space-between;align-items:center;gap:12px}
.next b{font-size:18px}

/* 목록 */
.rows{display:grid;gap:2px}
.row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:11px 12px;border-radius:15px;min-height:64px}
.row:hover{background:var(--surface-2)}
.row[aria-current=true]{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--pine-2)}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:700}
.row .amt{text-align:right;font-weight:800;font-size:21px;letter-spacing:-.02em;white-space:nowrap}
.row .amt small{font-size:13px;font-weight:600;margin-left:1px}
.split{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
.search{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 13px;margin-bottom:10px}

.item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .grow{flex:1;min-width:0}
.item .title{font-weight:600}
.item .amt{font-weight:700;white-space:nowrap;text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.pending{background:var(--wait);color:var(--wait-ink)}
.pill.approved{background:var(--good);color:var(--good-ink)}
.pill.rejected{background:var(--bad);color:var(--bad-ink)}
.textbtn{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:13px;min-height:32px}
details summary{cursor:pointer;color:var(--ink-2);font-weight:600;padding:10px 0;min-height:44px}

/* 요청함 */
.req{background:var(--surface);border-radius:22px;padding:20px 22px;margin-bottom:12px}
.req-top{display:flex;align-items:center;gap:13px}
.req-top .grow{flex:1;min-width:0}
.req h3{font-size:17px;font-weight:700}
.req .what{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:14px 0 2px}
.msg{margin-top:12px;padding:12px 15px;background:var(--surface-2);border-radius:4px 15px 15px 15px;white-space:pre-wrap;word-break:break-word}
.msg small{display:block;color:var(--ink-3);font-size:12.5px;margin-bottom:2px}
.req-actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:15px}
.empty{padding:50px 22px;text-align:center;background:var(--surface);border-radius:22px}
.empty h2{font-size:19px;margin-bottom:5px}
.empty .btn{margin-top:16px}

/* 달력 */
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav .btn{min-height:44px;min-width:44px;padding:0 12px}
.cal{background:var(--surface);border-radius:22px;padding:8px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{padding:8px 4px;text-align:center;font-size:13px;font-weight:600;color:var(--ink-3)}
.day{min-height:108px;padding:6px 5px;border-top:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;border-radius:0}
.day:hover{background:var(--surface-2)}
.day .d{font-weight:600;font-size:13.5px;width:25px;height:25px;display:grid;place-items:center;border-radius:50%}
.day.today .d{background:var(--primary);color:var(--primary-ink)}
.day.off .d{color:var(--ink-3)}
.day.out{visibility:hidden}
.chip{display:block;width:100%;border-radius:6px;padding:2px 5px;font-size:12px;font-weight:600;line-height:1.3;background:var(--chip-half);color:var(--chip-half-ink)}
.chip.full{background:var(--chip-full);color:var(--chip-full-ink)}
.chip.pending{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--ink-3);border-radius:6px}
.more{font-size:12px;color:var(--ink-3);padding-left:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ink-2);align-items:center}
.legend .chip{display:inline-block;width:auto}

/* 집계 */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 10px}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;height:170px;align-items:end;padding-top:24px;border-bottom:1px solid var(--line)}
.bar{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:6px}
.bar:hover{background:var(--surface-2)}
.bar i{display:block;width:min(70%,30px);background:var(--bar);border-radius:4px 4px 0 0;min-height:0}
.bar em{position:absolute;font-style:normal;font-size:12px;font-weight:700;transform:translateY(-100%);bottom:var(--h)}
.bar:hover::after,.bar:focus-visible::after{content:attr(data-tip);position:absolute;z-index:2;bottom:calc(var(--h) + 24px);white-space:nowrap;background:var(--ink);color:var(--bg);font-size:12.5px;padding:4px 8px;border-radius:7px}
.bar-x{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-top:6px;text-align:center;font-size:12px;color:var(--ink-3)}
.tbl-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:11px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:13px;font-weight:600;color:var(--ink-3);border-top:0}
th:first-child,td:first-child{text-align:left}
tbody tr:hover{background:var(--surface-2)}
tfoot td{font-weight:800}
.namebtn{font-weight:700;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;min-height:32px}

/* 대화상자 */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:24px;width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 48px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(6,20,16,.5)}
dialog[open]{animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.dlg{padding:24px}
.dlg h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:16px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:10px 12px}
.field textarea{min-height:92px;resize:vertical}
.hint{font-size:13px;color:var(--ink-3);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:13px;margin-bottom:14px}
.seg label{position:relative;text-align:center}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:grid;place-items:center;min-height:42px;border-radius:10px;font-weight:600;color:var(--ink-2)}
.seg input:checked+span{background:var(--primary);color:var(--primary-ink)}
.seg input:focus-visible+span{outline:3px solid #2f8f75;outline-offset:1px}
.preview{padding:11px 14px;border-radius:12px;background:var(--surface-2);font-weight:600;margin-bottom:14px}
.error{padding:11px 14px;border-radius:12px;background:var(--bad);color:var(--bad-ink);font-weight:600;margin-bottom:14px}
.dlg-actions{display:flex;gap:8px;margin-top:6px}
.dlg-actions .btn{flex:1}
.dlg-actions .btn.primary,.dlg-actions .btn.danger{flex:2}
.rule{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.rule:first-of-type{border-top:0}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.toast:empty{display:none}

/* 첫 화면 */
.welcome{min-height:100dvh;background:var(--pine);color:#fff;display:grid;place-items:center;padding:28px 20px}
.welcome-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,340px);gap:48px;align-items:center;max-width:900px;width:100%}
.welcome .brand{margin-bottom:26px}
.welcome h1{font-size:clamp(36px,6vw,58px);line-height:1.15;font-weight:800;letter-spacing:-.04em}
.welcome p{margin:16px 0 26px;color:#d6e6df;font-size:17px;max-width:30em}
.welcome .acts{display:flex;gap:8px;flex-wrap:wrap}
.welcome .btn.quiet{background:rgba(255,255,255,.12);color:#fff}
.auth{background:var(--surface);color:var(--ink);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.auth h2{font-size:21px;font-weight:800;margin-bottom:14px}
.auth .btn{width:100%}
.auth-links{display:flex;justify-content:space-between;margin-top:10px}

@media (max-width:899px){
  .wrap{padding:18px 16px 96px}
  .top-in{height:56px;padding:0 16px}
  .top .tabs{display:none}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
  .tabbar .tab{padding:8px 2px;min-height:52px;font-size:13.5px;border-radius:10px;box-shadow:none}
  .tabbar .tab[aria-current=page]{background:var(--surface-2);color:var(--ink)}
  .tabbar .badge{height:17px;min-width:17px;font-size:11px;margin-left:3px;padding:0 4px}
  .head h1{font-size:24px}
  .hero{grid-template-columns:1fr;padding:22px;border-radius:24px;gap:20px}
  .hero .tiles{max-width:190px}
  .testbar{padding:6px 16px;gap:4px 12px}
  .testbar .note{display:none}
  .facts{grid-template-columns:repeat(2,1fr);gap:12px;padding:16px 18px}
  .split{display:block}
  .split.has-sel .split-list{display:none}
  .split:not(.has-sel) .split-detail{display:none}
  .day{min-height:86px;padding:4px 2px}
  .chip{font-size:10.5px;padding:2px 3px;border-radius:5px}
  .cal{padding:4px}
  .welcome-in{grid-template-columns:1fr;gap:28px}
  .welcome .tiles{max-width:180px}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:24px 24px 0 0;max-height:92dvh}
  .toast{bottom:80px}
  .bars,.bar-x{gap:2px}
}
@media (min-width:900px){.back{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- 배포 때 빌드 스크립트가 만듭니다. 없으면 PC 테스트 모드로 실행됩니다. -->
<script src="config.js"></script>

<script id="engine">
/* 연차 계산 엔진: 화면과 저장소에 의존하지 않습니다. tests/engine.test.mjs 에서 그대로 검증합니다. */
var Engine = (function () {
  var CAP = 25;
  function parts(iso) { return iso.split('-').map(Number); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmt(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }
  function isDate(iso) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return false;
    var p = parts(iso), t = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    return t.getUTCFullYear() === p[0] && t.getUTCMonth() === p[1] - 1 && t.getUTCDate() === p[2];
  }
  /* 말일 보정: 1월 31일 + 1개월 = 2월 말일. 항상 입사일 기준으로 계산해 날짜가 밀리지 않습니다. */
  function addMonths(iso, n) {
    var p = parts(iso), total = p[0] * 12 + (p[1] - 1) + n;
    var y = Math.floor(total / 12), m = total - y * 12;
    var last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    return fmt(y, m + 1, Math.min(p[2], last));
  }
  function addDays(iso, n) {
    var p = parts(iso), t = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
    return fmt(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate());
  }
  function dayOfWeek(iso) { var p = parts(iso); return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); }
  function monthsPassed(from, to) {
    if (to < from) return 0;
    var a = parts(from), b = parts(to), n = (b[0] - a[0]) * 12 + (b[1] - a[1]);
    if (addMonths(from, n) > to) n--;
    return n;
  }
  function weekdays(start, end) {
    var c = 0;
    for (var d = start; d <= end; d = addDays(d, 1)) { var w = dayOfWeek(d); if (w !== 0 && w !== 6) c++; }
    return c;
  }
  /* 1년 15개, 그 뒤 2년마다 1개 가산(3년 16, 5년 17 ... 21년 25), 최대 25개 */
  function annualGrant(years) { return Math.min(CAP, 15 + Math.floor((years - 1) / 2)); }

  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; clearTimeout(toast.t); toast.t = setTimeout(function () { t.textContent = ''; }, 3200); }
  function monthRange(ym) { var from = ym + '-01'; return { from: from, to: E.addDays(E.addMonths(from, 1), -1) }; }
  function tabsFor() {
    var m = me(), out = [];
    if (m.isAdmin) out.push(['inbox', '요청함'], ['calendar', '달력'], ['stats', '집계'], ['staff', '직원']);
    if (m.employeeId) out.splice(m.isAdmin ? 4 : 0, 0, ['me', '내 연차']);
    if (!m.isAdmin && m.employeeId) out.push(['calendar', '달력']);
    return out;
  }
  async function refresh() {
    var r = await db.load();
    S.employees = r.employees; S.requests = r.requests;
    var rng = monthRange(S.month);
    S.cal = await db.calendar(E.addDays(rng.from, -1), E.addDays(rng.to, 1));
    var tabs = tabsFor();
    if (!tabs.some(function (t) { return t[0] === S.view; })) S.view = tabs.length ? tabs[0][0] : null;
    S.loadError = '';
  }
  async function act(fn, okMsg) {
    try { await fn(); await refresh(); render(); if (okMsg) toast(okMsg); return true; }
    catch (e) { toast(e.message || '요청을 처리하지 못했습니다.'); return false; }
  }

  /* ---------- 공통 조각 ---------- */
  function tiles(avail, hold, lit) {
    var a = Math.max(0, avail), b = Math.max(0, avail) + Math.max(0, hold), out = '';
    for (var i = 0; i < E.CAP; i++) {
      var fa = Math.min(1, Math.max(0, a - i)) * 100, fb = Math.min(1, Math.max(0, b - i)) * 100;
      out += '<span class="t" style="--a:' + fa + '%;--b:' + fb + '%;--i:' + i + '"></span>';
    }
    return '<div class="tiles' + (lit ? ' lit' : '') + '" role="img" aria-label="25칸 중 ' + n(a) + '칸 사용 가능, ' + n(b - a) + '칸 예정 또는 대기">' + out + '</div>';
  }
  function iconGrid(s) { return '<div class="icon-grid">' + tiles(s.available, s.planned + s.pending) + '</div>'; }
  function pill(st) { return '<span class="pill ' + st + '">' + STATUS[st] + '</span>'; }
  function whatKo(r) { return KIND[r.kind] + (r.kind === 'full' ? ' ' + n(r.days) + '개' : ''); }

  function hero(emp, opts) {
    var s = E.summary(emp, reqsOf(emp.id), S.asOf);
    var key = emp.id + ':' + s.available + ':' + s.planned + ':' + s.pending;
    var lit = S.litKey !== key; S.litKey = key;
    var hold = s.planned + s.pending;
    var sub = hold > 0 ? '예정과 대기 ' + n(hold) + '개를 빼면 ' + n(Math.max(0, s.available)) + '개를 더 쓸 수 있어요' : (s.balance >= E.CAP ? '최대 25개까지 모두 쌓였어요' : '지금 바로 쓸 수 있어요');
    return '<section class="hero" aria-label="' + h(emp.name) + ' 남은 연차"><div>' +
      '<div class="who"><b>' + h(emp.name) + '</b>' + h(emp.department || '') + (emp.department ? ', ' : '') + tenure(emp.hire_date, S.asOf) + '</div>' +
      '<div class="big num"><span>' + n(s.balance) + '</span><span>개</span></div><div class="sub">' + sub + '</div>' +
      '<div class="hero-actions">' + (opts.actions || '') + '</div></div>' + tiles(s.available, hold, lit) + '</section>' +
      '<div class="facts num"><div><b>' + n(s.granted) + '</b><span class="muted small">발생</span></div><div><b>' + n(s.used) + '</b><span class="muted small">사용</span></div><div><b>' + n(hold) + '</b><span class="muted small">예정·대기</span></div><div><b>' + n(s.lost) + '</b><span class="muted small">상한 초과 소멸</span></div></div>' +
      (s.next && s.next.lost > 0 ? '<div class="alert">' + dateKo(s.next.date) + '에 ' + n(s.next.amount) + '개가 발생하지만 상한 25개를 넘는 ' + n(s.next.lost) + '개는 사라져요. 그전에 쓰는 편이 좋아요.</div>' : '') +
      (s.next ? '<section class="panel"><div class="next"><div><div class="muted small">다음 발생</div><b>' + dateKo(s.next.date, true) + '</b></div><div class="num" style="font-weight:800;font-size:22px">+' + n(s.next.amount) + '개</div></div></section>' : '');
  }
  function requestItems(list, adminView) {
    if (!list.length) return '<p class="muted">아직 신청 내역이 없어요.</p>';
    return list.slice().sort(function (a, b) { return a.start_date < b.start_date ? 1 : -1; }).map(function (r) {
      return '<div class="item"><div class="grow"><div class="title">' + whatKo(r) + ' ' + pill(r.status) + '</div><div class="muted small">' + rangeKo(r) + '</div>' +
        (r.message ? '<div class="msg"><small>상사에게 전한 메시지</small>' + h(r.message) + '</div>' : '') +
        (r.decision_note ? '<div class="msg"><small>관리자 답변</small>' + h(r.decision_note) + '</div>' : '') +
        '</div>' +
        (adminView ? '<button class="textbtn" data-act="delReq" data-id="' + r.id + '">삭제</button>' : (r.status === 'pending' ? '<button class="textbtn" data-act="cancelReq" data-id="' + r.id + '">신청 취소</button>' : '')) +
        '</div>';
    }).join('');
  }
  function ledgerRow(e) {
    var title, amt;
    if (e.type === 'opening') { title = '기존 잔여로 시작'; amt = n(e.amount) + '개'; }
    else if (e.type === 'grant') { title = e.label + ' ' + n(e.amount) + '개' + (e.lost ? ' (상한 초과 ' + n(e.lost) + '개 소멸)' : ''); amt = '+' + n(e.added); }
    else { title = whatKo(e.req); amt = '−' + n(e.amount); }
    return '<div class="item"><div class="grow"><div class="title">' + title + '</div><div class="muted small">' + dateKo(e.date, true) + '</div></div><div class="amt num">' + amt + '<div class="muted small" style="font-weight:400">잔여 ' + n(e.balance) + '</div></div></div>';
  }
  function ledger(emp) {
    var rows = E.summary(emp, reqsOf(emp.id), S.asOf).ledger.slice().reverse();
    if (!rows.length) return '<p class="muted">아직 발생한 연차가 없어요. 입사 1개월이 지나면 1개가 생겨요.</p>';
    return rows.slice(0, 6).map(ledgerRow).join('') + (rows.length > 6 ? '<details><summary>전체 ' + rows.length + '건 보기</summary>' + rows.slice(6).map(ledgerRow).join('') + '</details>' : '');
  }

  /* ---------- 화면 ---------- */
  function viewMe() {
    var emp = empOf(me().employeeId);
    if (!emp) return '';
    return '<div class="narrow">' + hero(emp, { actions: '<button class="btn sun" data-act="newReq" data-emp="' + emp.id + '">연차 신청하기</button>' }) +
      '<section class="panel"><h2>내 신청</h2>' + requestItems(reqsOf(emp.id), false) + '</section>' +
      '<section class="panel"><h2>연차 내역</h2>' + ledger(emp) + '</section></div>';
  }
  function viewInbox() {
    var pending = S.requests.filter(function (r) { return r.status === 'pending'; }).sort(function (a, b) { return a.start_date < b.start_date ? -1 : 1; });
    var done = S.requests.filter(function (r) { return r.status !== 'pending'; }).sort(function (a, b) { return String(a.decided_at || '') < String(b.decided_at || '') ? 1 : -1; }).slice(0, 15);
    var body = pending.length ? pending.map(reqCard).join('') : '<div class="empty"><h2>기다리는 요청이 없어요</h2><p class="muted">직원이 연차를 신청하면 여기에 나타나요.</p></div>';
    return '<div class="narrow"><div class="head"><h1>' + (pending.length ? '승인을 기다리는 요청 ' + pending.length + '건' : '요청함') + '</h1></div>' + body +
      (done.length ? '<section class="panel"><h2>최근 처리한 요청</h2>' + done.map(function (r) {
        var e = empOf(r.employee_id);
        return '<div class="item"><div class="grow"><div class="title">' + h(e ? e.name : '') + ' ' + whatKo(r) + '</div><div class="muted small">' + rangeKo(r) + '</div>' + (r.decision_note ? '<div class="muted small">답변: ' + h(r.decision_note) + '</div>' : '') + '</div>' + pill(r.status) + '</div>';
      }).join('') + '</section>' : '') + '</div>';
  }
  function reqCard(r) {
    var e = empOf(r.employee_id); if (!e) return '';
    var list = reqsOf(e.id), s = E.summary(e, list, S.asOf);
    var others = S.requests.filter(function (o) { return o.id !== r.id && o.employee_id !== r.employee_id && o.status === 'approved' && o.start_date <= r.end_date && o.end_date >= r.start_date; })
      .map(function (o) { var x = empOf(o.employee_id); return x ? x.name : ''; });
    others = others.filter(function (v, i) { return others.indexOf(v) === i; });
    return '<article class="req"><div class="req-top">' + iconGrid(s) + '<div class="grow"><h3>' + h(e.name) + '</h3><div class="muted small">' + h(e.department || '') + (e.department ? ', ' : '') + tenure(e.hire_date, S.asOf) + '</div></div></div>' +
      '<div class="what">' + rangeKo(r) + ' ' + whatKo(r) + '</div>' +
      '<div class="muted small">승인 대기를 반영한 잔여 ' + n(Math.max(0, s.available)) + '개' + (others.length ? ', 같은 기간 휴가: ' + others.map(h).join(', ') : '') + '</div>' +
      (r.message ? '<div class="msg"><small>상사에게 전하는 메시지</small>' + h(r.message) + '</div>' : '') +
      '<div class="req-actions"><button class="btn ghost" data-act="reject" data-id="' + r.id + '">반려</button><button class="btn primary" data-act="approve" data-id="' + r.id + '">승인</button></div></article>';
  }
  function chipText(c) { return (c.kind === 'full' ? '연차' : c.kind === 'am' ? '오전' : '오후') + ' ' + c.name; }
  function dayItems(iso) {
    var w = E.dayOfWeek(iso), order = { am: 0, pm: 1, full: 2 };
    return S.cal.filter(function (c) { return c.start_date <= iso && c.end_date >= iso && !(c.kind === 'full' && (w === 0 || w === 6)); })
      .sort(function (a, b) { return order[a.kind] - order[b.kind] || a.name.localeCompare(b.name, 'ko'); });
  }
  function viewCalendar() {
    var p = S.month.split('-').map(Number), first = S.month + '-01', lead = E.dayOfWeek(first), rng = monthRange(S.month);
    var cells = DOW.map(function (d) { return '<div class="dow">' + d + '</div>'; }).join('');
    for (var i = 0; i < lead; i++) cells += '<div class="day out" aria-hidden="true"></div>';
    for (var d = first; d <= rng.to; d = E.addDays(d, 1)) {
      var items = dayItems(d), w = E.dayOfWeek(d), max = isDesktop() ? 3 : 2;
      var label = dateKo(d) + (items.length ? ', ' + items.map(chipText).join(', ') : ', 휴가 없음');
      cells += '<button class="day' + (w === 0 || w === 6 ? ' off' : '') + (d === S.asOf ? ' today' : '') + '" data-act="openDay" data-date="' + d + '" aria-label="' + h(label) + '"><span class="d num">' + Number(d.slice(8)) + '</span>' +
        items.slice(0, max).map(function (c) { return '<span class="chip ' + (c.kind === 'full' ? 'full ' : '') + (c.status === 'pending' ? 'pending' : '') + '">' + h(chipText(c)) + '</span>'; }).join('') +
        (items.length > max ? '<span class="more">외 ' + (items.length - max) + '명</span>' : '') + '</button>';
    }
    return '<div class="head"><h1>' + p[0] + '년 ' + p[1] + '월</h1><div class="cal-nav">' +
      '<button class="btn ghost" data-act="month" data-d="-1" aria-label="이전 달">‹</button><button class="btn ghost" data-act="month" data-d="0">오늘</button><button class="btn ghost" data-act="month" data-d="1" aria-label="다음 달">›</button></div></div>' +
      '<div class="cal">' + cells + '</div><div class="legend"><span><span class="chip full">연차 이름</span> 하루</span><span><span class="chip">오전 이름</span> 반차</span><span><span class="chip pending">오후 이름</span> 승인 대기</span><span>날짜를 누르면 전체 명단과 신청 버튼이 나와요.</span></div>';
  }
  function statRows() {
    return S.employees.filter(function (e) { return !S.dept || e.department === S.dept; }).map(function (e) {
      return { e: e, s: E.yearStats(e, reqsOf(e.id), S.year, S.asOf) };
    }).sort(function (a, b) { return a.e.name.localeCompare(b.e.name, 'ko'); });
  }
  function rate(s) { return s.granted > 0 ? Math.round(s.used / s.granted * 100) + '%' : '–'; }
  function viewStats() {
    var rows = statRows(), T = { granted: 0, used: 0, planned: 0, pending: 0, lost: 0, rejected: 0, balance: 0 };
    rows.forEach(function (r) { Object.keys(T).forEach(function (k) { T[k] += r.s[k]; }); });
    var ids = rows.map(function (r) { return r.e.id; }), months = new Array(12).fill(0);
    S.requests.forEach(function (r) { if (r.status === 'approved' && ids.indexOf(r.employee_id) >= 0 && r.start_date.slice(0, 4) === String(S.year)) months[Number(r.start_date.slice(5, 7)) - 1] += r.days; });
    var max = Math.max.apply(null, months), peak = months.indexOf(max);
    var depts = S.employees.map(function (e) { return e.department; }).filter(function (d, i, a) { return d && a.indexOf(d) === i; }).sort();
    var thisY = Number(S.asOf.slice(0, 4)), minY = S.employees.reduce(function (m, e) { return Math.min(m, Number(e.hire_date.slice(0, 4))); }, thisY), years = [];
    for (var y = thisY + 1; y >= Math.max(minY, thisY - 10); y--) years.push(y);
    return '<div class="head"><h1>' + S.year + '년 연차 집계</h1><div class="filters">' +
      '<label><span class="sr">연도</span><select data-change="year">' + years.map(function (y) { return '<option value="' + y + '"' + (y === S.year ? ' selected' : '') + '>' + y + '년</option>'; }).join('') + '</select></label>' +
      '<label><span class="sr">부서</span><select data-change="dept"><option value="">전체 부서</option>' + depts.map(function (d) { return '<option' + (d === S.dept ? ' selected' : '') + '>' + h(d) + '</option>'; }).join('') + '</select></label>' +
      '<button class="btn ghost" data-act="csv">CSV 내려받기</button></div></div>' +
      '<div class="facts num" style="margin-top:0"><div><b>' + n(T.granted) + '</b><span class="muted small">발생</span></div><div><b>' + n(T.used) + '</b><span class="muted small">사용 (' + rate(T) + ')</span></div><div><b>' + n(T.pending) + '</b><span class="muted small">승인 대기</span></div><div><b>' + n(T.balance) + '</b><span class="muted small">현재 잔여 합계</span></div></div>' +
      '<section class="panel"><h2>월별 승인 연차</h2><div class="bars">' + months.map(function (v, i) {
        var pct = max ? v / max * 100 : 0;
        return '<div class="bar" tabindex="0" style="--h:' + pct + '%" data-tip="' + (i + 1) + '월 ' + n(v) + '개" aria-label="' + (i + 1) + '월 ' + n(v) + '개"><i style="height:' + pct + '%"></i>' + (i === peak && v ? '<em class="num">' + n(v) + '</em>' : '') + '</div>';
      }).join('') + '</div><div class="bar-x num">' + months.map(function (_, i) { return '<span>' + (i + 1) + '</span>'; }).join('') + '</div></section>' +
      '<section class="panel"><h2>직원별 현황</h2><div class="tbl-wrap"><table class="num"><thead><tr><th>이름</th><th>부서</th><th>발생</th><th>사용</th><th>사용률</th><th>예정</th><th>대기</th><th>반려</th><th>소멸</th><th>잔여</th></tr></thead><tbody>' +
      rows.map(function (r) { var s = r.s; return '<tr><td><button class="namebtn" data-act="goEmp" data-id="' + r.e.id + '">' + h(r.e.name) + '</button></td><td>' + h(r.e.department || '–') + '</td><td>' + n(s.granted) + '</td><td>' + n(s.used) + '</td><td>' + rate(s) + '</td><td>' + n(s.planned) + '</td><td>' + n(s.pending) + '</td><td>' + s.rejected + '</td><td>' + n(s.lost) + '</td><td><b>' + n(s.balance) + '</b></td></tr>'; }).join('') +
      '</tbody><tfoot><tr><td>합계</td><td></td><td>' + n(T.granted) + '</td><td>' + n(T.used) + '</td><td>' + rate(T) + '</td><td>' + n(T.planned) + '</td><td>' + n(T.pending) + '</td><td>' + T.rejected + '</td><td>' + n(T.lost) + '</td><td>' + n(T.balance) + '</td></tr></tfoot></table></div></section>';
  }
  function viewStaff() {
    var q = S.q.trim().toLowerCase();
    var list = S.employees.filter(function (e) { return !q || (e.name + ' ' + (e.department || '')).toLowerCase().indexOf(q) >= 0; })
      .sort(function (a, b) { return a.name.localeCompare(b.name, 'ko'); });
    var selId = S.sel || (isDesktop() && list[0] ? list[0].id : null), sel = selId ? empOf(selId) : null;
    if (!S.employees.length) return '<div class="narrow"><div class="empty"><h2>직원을 등록해 주세요</h2><p class="muted">이름과 입사일만 넣으면 연차가 자동으로 계산돼요.</p><button class="btn primary" data-act="newEmp">직원 등록</button></div></div>';
    var rows = list.map(function (e) {
      var s = E.summary(e, reqsOf(e.id), S.asOf);
      return '<button class="row" data-act="pickEmp" data-id="' + e.id + '"' + (sel && sel.id === e.id ? ' aria-current="true"' : '') + '>' + iconGrid(s) + '<span class="grow"><span class="name">' + h(e.name) + '</span><br><span class="muted small">' + h(e.department || '') + (e.department ? ', ' : '') + tenure(e.hire_date, S.asOf) + '</span></span><span class="amt num">' + n(s.balance) + '<small>개</small></span></button>';
    }).join('');
    return '<div class="split' + (sel ? ' has-sel' : '') + '"><div class="split-list"><div class="head" style="margin-bottom:12px"><h1>직원 ' + S.employees.length + '명</h1><button class="btn primary" data-act="newEmp">직원 등록</button></div>' +
      '<label><span class="sr">이름 또는 부서 검색</span><input class="search" id="staff-q" type="search" placeholder="이름 또는 부서 검색" value="' + h(S.q) + '" data-input="q"></label><div class="rows">' + (rows || '<p class="muted" style="padding:12px">찾는 직원이 없어요.</p>') + '</div></div>' +
      '<div class="split-detail">' + (sel ? '<button class="link back" data-act="pickEmp" data-id="">‹ 직원 목록</button>' +
        hero(sel, { actions: '<button class="btn sun" data-act="newReq" data-emp="' + sel.id + '">연차 등록</button><button class="btn quiet" data-act="editEmp" data-id="' + sel.id + '">정보 수정</button>' }) +
        '<section class="panel"><h2>신청 내역</h2>' + requestItems(reqsOf(sel.id), true) + '</section><section class="panel"><h2>연차 내역</h2>' + ledger(sel) + '</section>' : '') + '</div></div>';
  }

  function shell(body) {
    var m = me(), pc = pendingCount();
    var tabs = tabsFor().map(function (t) { return '<button class="tab" data-act="tab" data-v="' + t[0] + '"' + (S.view === t[0] ? ' aria-current="page"' : '') + '>' + t[1] + (t[0] === 'inbox' && pc ? '<span class="badge num">' + pc + '</span>' : '') + '</button>'; }).join('');
    var test = '';
    if (!CLOUD) {
      var d = Local.read(), v = m.isAdmin ? 'admin' : m.employeeId;
      test = '<div class="testbar"><b>PC 테스트 모드</b><span class="note">이 브라우저에만 저장돼요</span><label>보는 사람 <select data-change="viewAs"><option value="admin">관리자</option>' + d.employees.map(function (e) { return '<option value="' + e.id + '"' + (v === e.id ? ' selected' : '') + '>직원: ' + h(e.name) + '</option>'; }).join('') + '</select></label>' +
        '<label>기준일 <input type="date" value="' + S.asOf + '" data-change="asOf"></label>' + (S.simulated ? '<button data-act="todayReset">오늘로 돌아가기</button>' : '') + '<button data-act="resetAll">데이터 초기화</button></div>';
    }
    return test + '<header class="top"><div class="top-in"><div class="brand">' + LOGO + '쉼표</div><nav class="tabs" aria-label="주요 메뉴">' + tabs + '</nav><div class="top-end"><button class="link" data-act="rules">연차 규칙</button>' + (CLOUD ? '<button class="link" data-act="signOut">로그아웃</button>' : '') + '</div></div></header>' +
      '<main class="wrap">' + body + '</main><nav class="tabbar" aria-label="주요 메뉴">' + tabs + '</nav>';

      if (!e.name) return fail('이름을 입력해 주세요.');
      var msg = checkMessage(E.check(e, reqsOf(e.id)));
      if (msg) return fail('이대로 저장하면 기존 신청과 맞지 않아요. ' + msg);
      closeDlg(); S.sel = e.id;
      await act(function () { return db.saveEmployee(e, !id); }, id ? '변경 내용을 저장했어요.' : e.name + ' 님을 등록했어요.');
    },
    auth: async function (form) {
      var f = new FormData(form), email = String(f.get('email')).trim(), pw = String(f.get('password') || ''), err = form.querySelector('#auth-err');
      err.innerHTML = '';
      var btn = form.querySelector('.btn.primary'); btn.disabled = true;
      try {
        if (S.auth === 'forgot') { await Cloud.recover(email); S.auth = 'in'; S.authNotice = '재설정 메일을 보냈어요. 메일의 링크를 눌러 주세요.'; render(); return; }
        if (S.auth === 'up') {
          var inNow = await Cloud.signUp(email, pw);
          if (!inNow) { S.auth = 'in'; S.authNotice = '확인 메일을 보냈어요. 링크를 누른 뒤 로그인해 주세요.'; render(); return; }
        } else { await Cloud.signIn(email, pw); }
        await startCloud();
      } catch (e) { err.innerHTML = '<div class="error">' + h(e.message) + '</div>'; btn.disabled = false; }
    },
    setPassword: async function (form) {
      var pw = String(new FormData(form).get('password') || ''), box = form.querySelector('#pw-err');
      try { await Cloud.setPassword(pw); closeDlg(); toast('비밀번호를 바꿨어요.'); }
      catch (e) { box.innerHTML = '<div class="error">' + h(e.message) + '</div>'; }
    }
  };
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (el && acts[el.dataset.act]) { if (el.tagName === 'BUTTON' && el.type !== 'submit') e.preventDefault(); acts[el.dataset.act](el.dataset, el); }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target.closest('[data-form]');
    if (f && forms[f.dataset.form]) { e.preventDefault(); forms[f.dataset.form](f); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.dataset.input === 'q') { S.q = e.target.value; render(); return; }
    var form = e.target.closest('form[data-form=request]');
    if (form) syncRequest(form, ['start', 'end'].indexOf(e.target.name) >= 0);
  });
  document.addEventListener('change', async function (e) {
    var k = e.target.dataset.change; if (!k) return;
    if (k === 'year') { S.year = Number(e.target.value); render(); }
    if (k === 'dept') { S.dept = e.target.value; render(); }
    if (k === 'viewAs') { var d = Local.read(); d.viewAs = e.target.value; Local.save(); S.view = null; S.sel = null; S.litKey = null; await refresh(); render(); }
    if (k === 'asOf' && E.isDate(e.target.value)) { S.asOf = e.target.value; S.simulated = S.asOf !== realToday(); S.month = S.asOf.slice(0, 7); S.year = Number(S.asOf.slice(0, 4)); await refresh(); render(); }
  });
  window.addEventListener('resize', function () { clearTimeout(window.__rz); window.__rz = setTimeout(function () { if (S.ready && document.activeElement.tagName !== 'INPUT') render(); }, 150); });

  /* ---------- 시작 ---------- */
  async function startCloud() {
    S.ready = false; S.loadError = '';
    try { await Cloud.identify(); await refresh(); S.ready = true; }
    catch (e) { S.loadError = e.message; }
    render();
  }
  function consumeHash() {
    var p = new URLSearchParams(location.hash.slice(1));
    if (p.get('access_token') && p.get('refresh_token')) {
      Cloud.setSession({ access_token: p.get('access_token'), refresh_token: p.get('refresh_token') });
      history.replaceState(null, '', location.pathname + location.search);
      return p.get('type');
    }
    return null;
  }
  (async function () {
    if (!CLOUD) { await refresh(); S.ready = true; render(); return; }
    Cloud.readSession();
    var type = consumeHash();
    if (!Cloud.session) { render(); return; }
    await startCloud();
    if (type === 'recovery') openDlg('<form class="dlg" data-form="setPassword"><h2 id="dlg-title">새 비밀번호 정하기</h2><label class="field"><span>새 비밀번호</span><input name="password" type="password" required minlength="8" autocomplete="new-password"></label><div id="pw-err"></div><div class="dlg-actions"><button class="btn primary">비밀번호 저장</button></div></form>');
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && Cloud.session && S.ready && !dlg.open) refresh().then(render).catch(function () {});
    });
  })();
})();
</script>
</body>
</html>
